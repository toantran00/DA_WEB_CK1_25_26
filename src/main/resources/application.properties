# Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://ASUS:1433;databaseName=DO_AN_WEB1;encrypt=true;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Encoding UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.open-in-view=false

# QUAN TRá»NG: Táº¯t naming strategy Äá» giá»¯ nguyÃªn tÃªn báº£ng
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# Server Configuration
server.port=8080

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# JWT Configuration - CRITICAL FIX
# Secret pháº£i dÃ i Ã­t nháº¥t 256 bits (32 kÃ½ tá»±) cho HS256
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_32_CHARS_MIN}
app.jwt.expirationMs=86400000

# Spring Security
spring.security.filter.dispatcher-types=REQUEST,ASYNC,ERROR

# Allow public access to web pages
spring.web.resources.add-mappings=true

# CORS
spring.web.cors.allowed-origins=http://localhost:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true 

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB

# Upload paths
#upload.path=uploads/images/
upload.users.path=uploads/users/

# Static Resource Handling
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:./uploads/

# Imasge Upload Path
upload.path=uploads/images/
upload.store-path=src/main/resources/static/images/products/

# Email Configuration for Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Scheduling for OTP cleanup
spring.task.scheduling.pool.size=2

# Payment Configuration
payment.mock.enabled=false
	
# VNPay Configuration (sanbox cong khai)
payment.vnpay.tmn-code=${VNPAY_TMN_CODE:67B6XRS4}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:CHANGE_ME}
payment.vnpay.endpoint=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8080/payment/vnpay/callback
payment.vnpay.version=2.1.0
payment.vnpay.command=pay
payment.vnpay.currency=VND

# MoMo Configuration (sandbox mau)
payment.momo.partner-code=${MOMO_PARTNER_CODE:MOMOIQA420180417}
payment.momo.access-key=${MOMO_ACCESS_KEY:CHANGE_ME}
payment.momo.secret-key=${MOMO_SECRET_KEY:CHANGE_ME}
payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.momo.return-url=http://localhost:8080/payment/momo/callback
payment.momo.notify-url=http://localhost:8080/payment/momo/ipn
payment.momo.request-type=captureWallet

# ===== Spring Boot Actuator =====
# Expose health, info, and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=SportShop E-Commerce
info.app.version=1.0.0
info.app.description=Multi-role e-commerce platform with VNPay/MoMo payment integration

# ===== SpringDoc OpenAPI / Swagger UI =====
# Access Swagger UI at: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Disable Swagger in production by setting this to false via env var
springdoc.swagger-ui.enabled=true
springdoc.show-actuator=false