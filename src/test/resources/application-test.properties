# Isolated test profile to avoid touching local SQL Server during tests
spring.datasource.url=jdbc:h2:mem:doanweb;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

spring.task.scheduling.enabled=false
spring.quartz.auto-startup=false

# Minimal values required by beans during context startup
app.jwt.secret=TEST_SECRET_KEY_WITH_MINIMUM_32_CHARS_LONG_1234
app.jwt.expirationMs=3600000
upload.path=target/test-uploads/images/
upload.users.path=target/test-uploads/users/
upload.store-path=target/test-uploads/products/

# Disable mail in tests
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password

# Disable data seeding in tests
app.data.seed=false

# Payment stubs for test context
payment.vnpay.tmn-code=TEST_TMN
payment.vnpay.hash-secret=TestHashSecretAtLeast32CharsMinimum
payment.vnpay.endpoint=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.vnpay.return-url=http://localhost:8080/payment/vnpay/callback
payment.vnpay.version=2.1.0
payment.vnpay.command=pay
payment.vnpay.currency=VND
payment.momo.partner-code=TEST_PARTNER
payment.momo.access-key=TEST_ACCESS_KEY
payment.momo.secret-key=TEST_SECRET_KEY
payment.momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
payment.momo.return-url=http://localhost:8080/payment/momo/callback
payment.momo.notify-url=http://localhost:8080/payment/momo/ipn
payment.momo.request-type=captureWallet
payment.mock.enabled=true

# Actuator (test)
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true

# Disable SpringDoc in tests to save startup time
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
