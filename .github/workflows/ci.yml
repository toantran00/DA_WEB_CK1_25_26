name: CI — Build & Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔑 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: 🧪 Run unit tests (H2 in-memory, test profile)
        run: ./mvnw test -Dspring.profiles.active=test
        env:
          # Provide dummy values so @Value-injected fields don't fail in test context
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          APP_JWT_SECRET: TestSecretForCIAtLeast32CharsLong!!
          MAIL_USERNAME: ci-test@example.com
          MAIL_PASSWORD: ci-test-password
          VNPAY_TMN_CODE: TEST_TMN
          VNPAY_HASH_SECRET: TEST_HASH_SECRET_32_CHARS_MIN_PLZZ
          MOMO_PARTNER_CODE: TEST_PARTNER
          MOMO_ACCESS_KEY: TEST_ACCESS_KEY
          MOMO_SECRET_KEY: TEST_SECRET_KEY

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔍 Validate project (compile check, no tests)
        run: ./mvnw validate compile -DskipTests
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          APP_JWT_SECRET: TestSecretForCIAtLeast32CharsLong!!
          MAIL_USERNAME: ci@example.com
          MAIL_PASSWORD: ci-pass
          VNPAY_TMN_CODE: TEST
          VNPAY_HASH_SECRET: TestHashSecret32CharsMinimumLength
          MOMO_PARTNER_CODE: TEST
          MOMO_ACCESS_KEY: TEST
          MOMO_SECRET_KEY: TEST
